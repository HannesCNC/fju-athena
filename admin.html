<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FJU Athena Admin</title><style>
:root{--bg:#0d0f10;--panel:#151819;--text:#f5f2e9;--muted:#b8b6ad;--yellow:#f5b82e;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(calc(100% - 28px),900px);margin:40px auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}h1{margin-bottom:4px}.muted{color:var(--muted)}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{width:100%;background:#0f1213;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--yellow);color:#111;font-weight:850;cursor:pointer}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}.item{padding:14px 0;border-top:1px solid var(--line)}.tag{font-size:.75rem;color:var(--yellow)}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>FJU Athena Admin</h1><p class="muted">Quick updates for the development knowledge base.</p><div class="card"><label>Admin key</label><input id="key" type="password" placeholder="ATHENA_ADMIN_KEY"><p class="muted">Stored only in this browser session.</p></div><form id="form" class="card"><div class="grid"><div><label>Title</label><input id="title" required></div><div><label>Date</label><input id="date" type="date" required></div></div><div class="grid"><div><label>Source type</label><select id="source"><option value="official_fju">Official FJU</option><option value="course_material">Course material</option><option value="lecture_notes">Lecture notes</option><option value="student_whatsapp">Student WhatsApp report</option><option value="other">Other</option></select></div><div><label>Valid until (optional)</label><input id="valid" type="date"></div></div><label>Keywords (comma separated)</label><input id="keywords" placeholder="homework, week 3, submission"><label>Information</label><textarea id="content" required placeholder="Paste or type the update here..."></textarea><div class="row"><button class="btn" type="submit">Add to Athena</button><button id="refresh" class="btn secondary" type="button">Refresh knowledge list</button></div><p id="status" class="muted"></p></form><section class="card"><h2>Current knowledge</h2><div id="list" class="muted">Enter admin key and press Refresh.</div></section></main><script>
const API_BASE=window.ATHENA_API_BASE||'https://YOUR-ATHENA-BACKEND.up.railway.app';const key=document.getElementById('key');key.value=sessionStorage.getItem('athenaKey')||'';key.addEventListener('input',()=>sessionStorage.setItem('athenaKey',key.value));document.getElementById('date').value=new Date().toISOString().slice(0,10);
const status=document.getElementById('status');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';const payload={title:title.value.trim(),date:date.value,source_type:source.value,valid_until:valid.value||null,keywords:keywords.value.split(',').map(x=>x.trim()).filter(Boolean),content:content.value.trim(),audience:'students'};try{const r=await fetch(API_BASE+'/api/athena/knowledge',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key.value},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Save failed');status.textContent='Saved.';content.value='';keywords.value='';title.value='';await load();}catch(err){status.textContent=err.message}});document.getElementById('refresh').onclick=load;async function load(){const box=document.getElementById('list');box.textContent='Loading…';try{const r=await fetch(API_BASE+'/api/athena/knowledge',{headers:{'X-Admin-Key':key.value}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Load failed');box.innerHTML=d.items.map(x=>`<div class="item"><div class="tag">${x.source_type} · ${x.date||''}</div><strong>${esc(x.title)}</strong><div class="muted">${esc(x.content).slice(0,220)}${x.content.length>220?'…':''}</div></div>`).join('')||'No items.';}catch(err){box.textContent=err.message}}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
